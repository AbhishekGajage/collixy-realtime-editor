services:
  # ─── MongoDB ───────────────────────────────
  mongo:
    image: mongo:7
    container_name: collixy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: collixy-db
    networks:
      - collixy-net

  # ─── Redis ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: collixy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - collixy-net

  # ─── Piston (self-hosted code execution engine) ─
  # Replaces the public emkc.org Piston API, which now requires an
  # authorization key and returns 401 without one (as of Feb 15, 2026).
  # `privileged: true` is required — Piston sandboxes each run in its own
  # nsjail/cgroup, which needs real kernel privileges. This is why Piston
  # cannot run on most restricted-container PaaS platforms (see render.yaml).
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: collixy-piston
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec
    networks:
      - collixy-net

  # ─── Backend (Node / Express / Socket.IO) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collixy-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    depends_on:
      - mongo
      - redis
      - piston
    env_file:
      - ./backend/.env
    environment:
      # Override DB & Redis to use Docker service names
      MONGODB_URI: mongodb://mongo:27017/collixy-db
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost
      BACKEND_URL: http://localhost:5001
      # Self-hosted Piston, reached by its service name on the compose network
      PISTON_URL: http://piston:2000
    networks:
      - collixy-net

  # ─── Frontend (Vite → nginx) ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:5001
        VITE_FRONTEND_URL: http://localhost
        VITE_GOOGLE_OAUTH_ENABLED: "true"
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: collixy-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - collixy-net

volumes:
  mongo_data:
  redis_data:
  piston_packages:

networks:
  collixy-net:
    driver: bridge
