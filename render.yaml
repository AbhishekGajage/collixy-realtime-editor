services:
  # Backend Web Service (Node.js + Express + Socket.IO)
  - type: web
    name: collixy-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Self-hosted Piston (code execution) URL. Render's web services do not
      # support `privileged: true` containers, which Piston requires for its
      # per-run sandboxing — so Piston itself cannot run as a Render service
      # in this file. Host it separately (a VPS/droplet with Docker, Fly.io
      # Machines, etc. — see docker-compose.yml's `piston` service for the
      # image/config) and point this at that instance's public URL.
      - key: PISTON_URL
        sync: false
      - key: EXECUTE_RATE_LIMIT_MAX
        value: 20

  # Frontend Static Site (React + Vite SPA)
  - type: web
    name: collixy-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
      - key: VITE_FRONTEND_URL
        sync: false
      - key: VITE_GOOGLE_OAUTH_ENABLED
        value: "true"
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
